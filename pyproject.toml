[project]
name = "support-bot"
version = "0.1.0"
description = "RAG support bot: answers from a knowledge base on a website widget and in Telegram"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
kb = "support_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_bot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
# Комментарии и докстринги в проекте на русском: кириллица — не опечатка.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src", "tests", "migrations"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.4",
]
